services:
  hidocknotes:
    image: ghcr.io/amitai5/hidocknotes:${HIDOCKNOTES_VERSION:-0.15.1}
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${WEB_PORT:-10708}:${WEB_PORT:-10708}"
    environment:
      APP_ORIGIN: "${APP_ORIGIN:?Set the exact HTTPS website origin in .env}"
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:-}"
      PORT: "${WEB_PORT:-10708}"
      DATA_DIR: /data
      BACKUP_DIR: /backups
      SECRET_KEY_FILE: /data/secrets/server.key
      OMP_NUM_THREADS: "4"
      TZ: "${TZ:-America/Los_Angeles}"
    volumes:
      - "${HIDOCK_DATA_DIR:?Set the TrueNAS library dataset path}:/data"
      - "${HIDOCK_BACKUP_DIR:?Set the TrueNAS backup dataset path}:/backups"
    # Upper limits only. No CPU or memory reservation is configured.
    cpus: 8
    mem_limit: 12g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
