name: Build apps, Docker image and release

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

# Deduplicate a commit without cancelling a different version waiting to build.
concurrency:
  group: hidocknotes-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate version and check existing release
        id: plan
        run: node scripts/release/prepare.cjs
        env:
          GH_TOKEN: ${{ github.token }}

  validate:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: Test and compile once
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --strict-allow-scripts
      - name: Check versions
        run: npm run release:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Compile shared application
        run: npm run build --workspace=packages/jensen-protocol && npm run build --workspace=apps/electron && npm run build --workspace=apps/web && npm run build --workspace=apps/server
      # These files contain JavaScript, declarations and renderer assets only.
      # Native dependencies are installed independently on every target runner.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-app-${{ needs.prepare.outputs.commit }}
          path: |
            apps/web/dist/
            apps/server/dist/
            apps/electron/out/
            packages/jensen-protocol/dist/
          if-no-files-found: error
          retention-days: 2

  build:
    needs: [prepare, validate]
    if: needs.prepare.outputs.publish == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            package: package:win
          - platform: linux-x64
            runner: ubuntu-24.04
            package: package:linux
          - platform: macos-x64
            runner: macos-15-intel
            package: package:mac
          - platform: macos-arm64
            runner: macos-15
            package: package:mac
    env:
      HIDOCKNOTES_SIGNED_RELEASE: ${{ vars.RELEASE_SIGNING_ENABLED || 'false' }}
      UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Set packaging cache paths
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"
      - name: Cache native downloads and packaging tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/.cache/ffmpeg-static-nodejs
            ~/Library/Caches/ffmpeg-static-nodejs
            ~/AppData/Local/ffmpeg-static-nodejs/Cache
          key: electron-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/electron/package.json') }}
          restore-keys: electron-tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Install locked dependencies and native binaries
        run: npm ci --strict-allow-scripts --no-audit --no-fund
      - name: Download tested application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-app-${{ needs.prepare.outputs.commit }}
          path: .
          digest-mismatch: error
      - name: Check versions and native modules
        run: |
          npm run release:check
          npm run smoke:native
      # Omit certificate variables entirely for unsigned builds. An empty
      # CSC_LINK is treated as a certificate file path by electron-builder.
      - name: Build installer (unsigned)
        if: env.HIDOCKNOTES_SIGNED_RELEASE != 'true'
        run: npm run ${{ matrix.package }} --workspace=apps/electron
      - name: Build installer (signed)
        if: env.HIDOCKNOTES_SIGNED_RELEASE == 'true'
        run: npm run ${{ matrix.package }} --workspace=apps/electron
        env:
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify platform signatures and notarization
        run: node scripts/release/verify-signatures.cjs
        env:
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Test packaged native modules and resources
        run: npm run smoke:package
      - name: Collect platform installers
        run: node scripts/release/artifacts.cjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: release/${{ needs.prepare.outputs.version }}/assets/${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  container:
    needs: [prepare, validate]
    if: needs.prepare.outputs.publish == 'true'
    name: Test and publish TrueNAS image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiled-app-${{ needs.prepare.outputs.commit }}
          path: .
          digest-mismatch: error
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and load image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/amitai5/hidocknotes:sha-${{ needs.prepare.outputs.commit }}
          build-args: |
            APP_BUILD=prebuilt
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.commit }}
          cache-from: type=gha,scope=hidocknotes-server
          cache-to: type=gha,mode=max,scope=hidocknotes-server
      - name: Test container startup, PWA and authentication
        run: node scripts/release/container-smoke.cjs ghcr.io/amitai5/hidocknotes:sha-${{ needs.prepare.outputs.commit }}
      - name: Push the verified image and record its digest
        id: image
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          image="ghcr.io/amitai5/hidocknotes:sha-$COMMIT"
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Prepare PWA and deployment release assets
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/release/hosted.cjs metadata
          tar -czf "release/hosted/HiDockNotes-$VERSION-web.tar.gz" -C apps/web/dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-${{ needs.prepare.outputs.version }}
          path: release/hosted/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [prepare, build, container]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    concurrency:
      group: hidocknotes-publish-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-${{ needs.prepare.outputs.version }}-*
          path: release/ci-assets
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: hosted-${{ needs.prepare.outputs.version }}
          path: release/ci-assets
          digest-mismatch: error
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify downloads, create checksums and publish release
        run: node scripts/release/publish.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          HIDOCK_HOSTED_RELEASE: "true"
          HIDOCKNOTES_SIGNED_RELEASE: ${{ vars.RELEASE_SIGNING_ENABLED || 'false' }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}

  latest-image:
    needs: [prepare, publish]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.prepare.outputs.publish == 'false')
    name: Update latest stable Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    # All versions share one lock. Resolve the current published release inside it.
    concurrency:
      group: hidocknotes-latest-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test stable image promotion
        run: node --test scripts/release/latest-image.test.cjs
      - name: Test TrueNAS automatic updater
        run: |
          python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v
          python3 scripts/deployment/truenas_auto_update.py --help
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified image from the current stable release
        run: node scripts/release/latest-image.cjs
        env:
          GH_TOKEN: ${{ github.token }}
